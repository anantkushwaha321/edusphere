<!-- Ambient Liquid Glass Background Canvas & Glowing Light Orbs -->
<div class="fixed inset-0 pointer-events-none overflow-hidden z-0" aria-hidden="true">
    <!-- Canvas for floating interactive particle stars -->
    <canvas id="ambientCanvas" class="absolute inset-0 w-full h-full opacity-60"></canvas>

    <!-- Top Left Violet Glow -->
    <div class="ambient-glow ambient-glow-violet w-[550px] h-[550px] -top-48 -left-48 animate-ambient-drift"></div>

    <!-- Top Right Electric Blue Glow -->
    <div class="ambient-glow ambient-glow-blue w-[650px] h-[650px] -top-36 -right-48 animate-pulse-glow"></div>

    <!-- Bottom Center Cyan Glow -->
    <div class="ambient-glow ambient-glow-cyan w-[500px] h-[500px] -bottom-36 left-1/3 animate-ambient-drift opacity-40"></div>
</div>

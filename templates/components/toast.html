{% if messages %}
<div class="fixed top-20 right-4 z-50 space-y-2 max-w-sm w-full pointer-events-none" role="status" aria-live="polite">
    {% for message in messages %}
    <div class="pointer-events-auto glass-card p-4 text-xs font-semibold border shadow-2xl flex items-center justify-between space-x-3 animate-fade-in {% if message.tags == 'error' %}border-rose-500/40 bg-rose-950/60 text-rose-200{% elif message.tags == 'success' %}border-emerald-500/40 bg-emerald-950/60 text-emerald-200{% elif message.tags == 'warning' %}border-amber-500/40 bg-amber-950/60 text-amber-200{% else %}border-blue-500/40 bg-blue-950/60 text-blue-200{% endif %}">
        <div class="flex items-center space-x-2.5">
            <span class="text-base" aria-hidden="true">
                {% if message.tags == 'error' %}⚠️{% elif message.tags == 'success' %}✅{% elif message.tags == 'warning' %}🔔{% else %}ℹ️{% endif %}
            </span>
            <p class="leading-snug">{{ message }}</p>
        </div>
        <button onclick="this.closest('.glass-card').remove()" class="text-slate-400 hover:text-white p-1 rounded-lg focus:outline-none" aria-label="Dismiss alert">
            &times;
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}

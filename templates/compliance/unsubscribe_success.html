<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preferences Updated — IIMT UNIVERSITY</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-2xl space-y-6 text-white text-center">
        <div class="w-14 h-14 rounded-2xl bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center text-2xl mx-auto">
            ✅
        </div>

        <div>
            <h1 class="text-xl font-bold">Preferences Successfully Updated</h1>
            <p class="text-xs text-slate-300 mt-2">
                Your email preferences have been recorded for <strong class="text-white">{{ pref.user.email }}</strong>. You will no longer receive the specified categories.
            </p>
        </div>

        <div>
            <a href="{% url 'login' %}" class="inline-block px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-xs transition-colors shadow-md">
                Return to IIMT UNIVERSITY Portal
            </a>
        </div>
    </div>
</body>
</html>

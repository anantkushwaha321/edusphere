{% extends 'base.html' %}

{% block title %}{{ title }} — IIMT UNIVERSITY{% endblock %}
{% block header_title %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-white p-8 rounded-3xl border border-slate-200/80 shadow-sm space-y-6">
    <div class="border-b border-slate-100 pb-3">
        <h2 class="text-lg font-bold text-slate-900">{{ title }}</h2>
    </div>

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Department Name *</label>
            {{ form.name }}
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Department Code *</label>
            {{ form.code }}
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Head of Department (Faculty)</label>
            {{ form.head_of_department }}
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Description</label>
            {{ form.description }}
        </div>

        <div class="pt-4 flex items-center justify-end space-x-3">
            <a href="{% url 'department_list' %}" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs transition-all">Cancel</a>
            <button type="submit" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-xs shadow-sm transition-all">Save Department</button>
        </div>
    </form>
</div>
{% endblock %}

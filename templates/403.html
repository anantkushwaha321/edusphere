{% extends 'base.html' %}

{% block title %}403 — Access Restricted | EduSphere{% endblock %}

{% block content %}
<div class="min-h-[50vh] flex items-center justify-center p-4">
    <div class="app-card max-w-md w-full text-center p-6 sm:p-8 space-y-4">
        <span class="app-badge app-badge-amber text-xs font-mono font-semibold">403</span>
        <h1 class="text-xl font-bold text-white">Access Restricted</h1>
        <p class="text-xs text-slate-400 leading-relaxed">
            Your current institutional account role does not have authorization to view this partition.
        </p>
        <div class="pt-2 flex flex-wrap items-center justify-center gap-2">
            <a href="{% if request.user.is_authenticated %}{% url 'dashboard' %}{% else %}{% url 'home' %}{% endif %}" class="app-btn app-btn-primary text-xs py-1.5 px-3 rounded-md">
                <span>&larr; Return to Workspace</span>
            </a>
            <a href="{% url 'profile' %}" class="app-btn app-btn-secondary text-xs py-1.5 px-3 rounded-md">
                <span>Account Clearance</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
